# NeoForge's OpenGL early loading window cannot be handed to Minecraft's
# experimental Vulkan backend because GLFW did not create it with NO_API.
# This complete FML file is copied only into the isolated Vulkan smoke-test
# directory, avoiding both the early window and config auto-correction noise.
earlyWindowControl = false
disableConfigWatcher = false
maxThreads = -1
versionCheck = true
debugOpenGl = false
defaultConfigPath = "defaultconfigs"
disableOptimizedDFU = true
earlyWindowProvider = "fmlearlywindow"
earlyWindowWidth = 854
earlyWindowHeight = 480
earlyWindowMaximized = false
earlyLoadingScreenTheme = ""
