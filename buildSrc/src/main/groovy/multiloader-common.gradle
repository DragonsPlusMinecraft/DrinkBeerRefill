plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "drinkbeer-refill-${minecraft_version}-${project.name}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.blamejared.com/' }
}

dependencies {
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
    options.compilerArgs.addAll('-Xlint:deprecation', '-Xlint:unchecked')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'drinkbeer.projectDir', project(':common').projectDir.absolutePath
}

tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE'))
    manifest {
        attributes(
                'Specification-Title': mod_name,
                'Specification-Vendor': mod_authors,
                'Specification-Version': mod_version,
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': mod_authors,
                'Built-On-Minecraft': minecraft_version
        )
    }
}

tasks.named('processResources', ProcessResources).configure {
    def expandProps = [
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: project.version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version: fabric_api_version,
            neo_version: neo_version,
            neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            java_version: java_version
    ]
    inputs.properties(expandProps)
    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
        expand(expandProps)
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
