plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.143' apply false
    id 'net.fabricmc.fabric-loom' version '1.17.19' apply false
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1' apply false
}

group = mod_group_id
version = mod_version

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'idea'

    group = rootProject.mod_group_id
    version = project.name in ['fabric', 'neoforge']
            ? "${rootProject.mod_version}+${project.name}"
            : rootProject.mod_version

    base {
        archivesName = "drinkbeer-refill-${rootProject.minecraft_version}-${project.name}"
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
        withSourcesJar()
    }

    repositories {
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.blamejared.com/' }
    }

    dependencies {
        compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = rootProject.java_version as int
        options.compilerArgs.addAll('-Xlint:deprecation', '-Xlint:unchecked')
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        systemProperty 'drinkbeer.projectDir', project(':common').projectDir.absolutePath
    }

    tasks.named('jar', Jar).configure {
        from(rootProject.file('LICENSE'))
        manifest {
            attributes(
                    'Specification-Title': rootProject.mod_name,
                    'Specification-Vendor': rootProject.mod_authors,
                    'Specification-Version': rootProject.mod_version,
                    'Implementation-Title': project.name,
                    'Implementation-Version': project.version,
                    'Implementation-Vendor': rootProject.mod_authors,
                    'Built-On-Minecraft': rootProject.minecraft_version
            )
        }
    }

    tasks.named('processResources', ProcessResources).configure {
        def expandProps = [
                mod_id                 : rootProject.mod_id,
                mod_name               : rootProject.mod_name,
                mod_license            : rootProject.mod_license,
                mod_version            : project.version,
                mod_authors            : rootProject.mod_authors,
                mod_description        : rootProject.mod_description,
                minecraft_version      : rootProject.minecraft_version,
                minecraft_version_range: rootProject.minecraft_version_range,
                fabric_loader_version  : rootProject.fabric_loader_version,
                fabric_api_version     : rootProject.fabric_api_version,
                neo_version            : rootProject.neo_version,
                neo_version_range      : rootProject.neo_version_range,
                loader_version_range   : rootProject.loader_version_range,
                java_version           : rootProject.java_version
        ]
        inputs.properties(expandProps)
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
            expand(expandProps)
        }
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}

configure([project(':fabric'), project(':neoforge')]) {
    configurations {
        commonJava {
            canBeResolved = true
            canBeConsumed = false
        }
        commonResources {
            canBeResolved = true
            canBeConsumed = false
        }
        commonTestJava {
            canBeResolved = true
            canBeConsumed = false
        }
        commonTestResources {
            canBeResolved = true
            canBeConsumed = false
        }
    }

    dependencies {
        compileOnly(project(':common'))
        testImplementation(project(':common'))
        commonJava project(path: ':common', configuration: 'commonJava')
        commonResources project(path: ':common', configuration: 'commonResources')
        commonTestJava project(path: ':common', configuration: 'commonTestJava')
        commonTestResources project(path: ':common', configuration: 'commonTestResources')
    }

    tasks.named('compileJava', JavaCompile).configure {
        dependsOn(configurations.commonJava)
        source(configurations.commonJava)
    }

    tasks.named('processResources', ProcessResources).configure {
        dependsOn(configurations.commonResources)
        from(configurations.commonResources)
    }

    tasks.named('compileTestJava', JavaCompile).configure {
        dependsOn(configurations.commonTestJava)
        source(configurations.commonTestJava)
    }

    tasks.named('processTestResources', ProcessResources).configure {
        dependsOn(configurations.commonTestResources)
        from(configurations.commonTestResources)
    }

    tasks.named('sourcesJar', Jar).configure {
        dependsOn(configurations.commonJava, configurations.commonResources)
        from(configurations.commonJava)
        from(configurations.commonResources)
    }
}

tasks.named('assemble') {
    dependsOn(':fabric:assemble', ':neoforge:assemble')
}

tasks.named('check') {
    dependsOn(':fabric:check', ':neoforge:check')
}

tasks.named('build') {
    dependsOn(':fabric:build', ':neoforge:build')
}

tasks.register('publish') {
    group = 'publishing'
    description = 'Publishes both loader artifacts to the Dragons Plus Maven.'
    dependsOn(':fabric:publish', ':neoforge:publish')
}

tasks.register('publishMods') {
    group = 'publishing'
    description = 'Publishes both loader artifacts to CurseForge and Modrinth.'
    dependsOn(':fabric:publishMods', ':neoforge:publishMods')
}
