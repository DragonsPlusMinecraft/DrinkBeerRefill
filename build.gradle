plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.143'
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id
base {
    archivesName = "drinkbeer-refill-${minecraft_version}"
}

// Minecraft 1.20.1 ships with Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // NeoForge 1.20.1 still uses the Forge-era API and coordinates.
    enable {
        neoForgeVersion = project.neo_version
    }

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // LegacyForge has no integrated unit-test loader. Add the remapped game/API
    // classes so pure JUnit helpers that reference Minecraft value types compile.
    addModdingDependenciesTo(sourceSets.test)

}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

repositories {
    mavenCentral()
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
}

dependencies {
    // Jade
    //implementation "curse.maven:jade-${jade_project_id}:${jade_file_id}"

    modCompileOnly "mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${jei_minecraft_version}-forge-api:${jei_version}"
    modLocalRuntime "mezz.jei:jei-${jei_minecraft_version}-forge:${jei_version}"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'drinkbeer.projectDir', project.projectDir.absolutePath
}

tasks.named('jar', Jar).configure {
    from(rootProject.file('LICENSE'))
    includeEmptyDirs = false
    // GameTests run from the development classes directory and are not shipped to players.
    exclude '**/*GameTests*.class'
    exclude 'data/drinkbeer/structures/empty.nbt'
}

def releaseJarTask = tasks.named('jar', Jar)
def reobfReleaseJarTask = tasks.named('reobfJar')
def expectedReleaseJarName = "drinkbeer-refill-1.20.1-${mod_version}.jar"

tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Verifies the packaged 1.20.1 metadata and data-pack layout.'
    dependsOn reobfReleaseJarTask
    inputs.file(releaseJarTask.flatMap { it.archiveFile })

    doLast {
        File archive = inputs.files.singleFile
        if (archive.name != expectedReleaseJarName) {
            throw new GradleException("Expected ${expectedReleaseJarName}, got ${archive.name}")
        }

        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            Set<String> entries = new HashSet<>()
            zip.entries().each { entries.add(it.name) }

            List<String> requiredEntries = [
                    'META-INF/mods.toml',
                    'pack.mcmeta',
                    'data/drinkbeer/recipes/beer_mug.json',
                    'data/drinkbeer/loot_tables/blocks/beer_barrel.json',
                    'data/drinkbeer/tags/items/beers.json',
                    'data/forge/tags/items/milk/milk_bottle.json'
            ]
            requiredEntries.each { entry ->
                if (!entries.contains(entry)) {
                    throw new GradleException("Missing required JAR entry: ${entry}")
                }
            }

            List<String> forbiddenPrefixes = [
                    'META-INF/neoforge.mods.toml',
                    'data/c/',
                    'data/drinkbeer/recipe/',
                    'data/drinkbeer/loot_table/',
                    'data/drinkbeer/structure/',
                    'data/drinkbeer/tags/item/',
                    'data/drinkbeer/data_components/',
                    'data/drinkbeer/structures/empty.nbt',
                    'lekavar/lma/drinkbeer/gametest/',
                    'lekavar/lma/drinkbeer/networking/TradeBoxNetworkGameTests'
            ]
            forbiddenPrefixes.each { prefix ->
                if (entries.any { entry -> entry == prefix || entry.startsWith(prefix) }) {
                    throw new GradleException("Found incompatible JAR entry: ${prefix}")
                }
            }

            int lootTableCount = entries.count {
                it.startsWith('data/drinkbeer/loot_tables/blocks/') && it.endsWith('.json')
            }
            if (lootTableCount != 52) {
                throw new GradleException("Expected 52 block loot tables, found ${lootTableCount}")
            }

            String metadata = zip.getInputStream(zip.getEntry('META-INF/mods.toml')).getText('UTF-8')
            if (!metadata.contains('modId="forge"')
                    || !metadata.contains('versionRange="[47.1.106,)"')
                    || !metadata.contains('versionRange="[1.20.1,1.20.2)"')) {
                throw new GradleException('mods.toml does not contain the required 1.20.1 NeoForge ranges')
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyReleaseJar')
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishMods {
    file = tasks.jar.archiveFile
    changelog = new File("CHANGELOG.md").text
    version = mod_version
    type = BETA
    displayName = "Drink Beer Refill ${mod_version} for ${minecraft_version}"
    modLoaders.add("neoforge")

    curseforge {
        projectId = "729120"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        client = true
        server = true
    }

    modrinth {
        projectId = "RZwVw5iA"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url = "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
