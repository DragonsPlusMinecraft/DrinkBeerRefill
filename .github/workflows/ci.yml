name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload failure reports and run logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drinkbeer-refill-failure-${{ github.sha }}
          path: |
            **/build/reports/
            **/build/test-results/
            **/logs/
            **/runs/**/logs/
            **/run/**/logs/
          if-no-files-found: ignore

      - name: Upload Fabric and NeoForge jars
        uses: actions/upload-artifact@v4
        with:
          name: drinkbeer-refill-${{ github.sha }}
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-dev.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-dev.jar
          if-no-files-found: error
