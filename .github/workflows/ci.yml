name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build-server:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Unit, server, and artifact gates
        run: ./gradlew verifyUnit verifyServer verifyArtifacts generateReleaseChecksums --stacktrace --dependency-verification strict
      - name: Upload build and server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-server-${{ github.sha }}
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/run/**/logs/
            **/build/run/**/crash-reports/
            **/build/run/**/hs_err_pid*.log
            build/release/
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            !**/*-sources.jar
            !**/*-dev.jar
          if-no-files-found: warn

  fabric-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Install virtual display and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils
      - name: Run real Fabric client gate
        run: xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew verifyFabricClient --stacktrace --dependency-verification strict
      - name: Upload Fabric client evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-client-evidence-${{ github.sha }}
          path: |
            fabric/build/run/clientGameTest/client-test-evidence/
            fabric/build/run/clientGameTest/screenshots/
            fabric/build/run/clientGameTest/logs/
            fabric/build/run/clientGameTest/crash-reports/
            fabric/build/run/clientGameTest/hs_err_pid*.log
            build/reports/verification/fabric-*.json
          if-no-files-found: warn
      - name: Upload same-version Fabric world
        uses: actions/upload-artifact@v4
        with:
          name: fabric-world-${{ github.sha }}
          path: fabric/build/run/clientGameTest/client-test-evidence/world-fixture/
          if-no-files-found: error

  neoforge-client:
    needs: fabric-client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Install virtual display and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils
      - uses: actions/download-artifact@v4
        with:
          name: fabric-world-${{ github.sha }}
          path: ci-worlds/fabric
      - name: Run real NeoForge client gate
        run: xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew verifyNeoForgeClient -PclientWorldFixture="$PWD/ci-worlds/fabric" --stacktrace --dependency-verification strict
      - name: Upload NeoForge client evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-client-evidence-${{ github.sha }}
          path: |
            neoforge/build/run/clientSmoke/client-test-evidence/
            neoforge/build/run/clientSmoke/screenshots/
            neoforge/build/run/clientSmoke/logs/
            neoforge/build/run/clientSmoke/crash-reports/
            neoforge/build/run/clientSmoke/hs_err_pid*.log
            build/reports/verification/neoforge-*.json
          if-no-files-found: warn
      - name: Upload same-version NeoForge-saved world
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-world-${{ github.sha }}
          path: neoforge/build/run/clientSmoke/saves/drinkbeer-smoke/
          if-no-files-found: error

  compatibility:
    needs: [fabric-client, neoforge-client]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - uses: actions/download-artifact@v4
        with:
          name: fabric-world-${{ github.sha }}
          path: ci-worlds/fabric
      - uses: actions/download-artifact@v4
        with:
          name: neoforge-world-${{ github.sha }}
          path: ci-worlds/neoforge
      - name: Verify same-Minecraft-version cross-loader persistence
        run: ./gradlew verifyCompatibility -PfabricWorldFixture="$PWD/ci-worlds/fabric" -PneoForgeWorldFixture="$PWD/ci-worlds/neoforge" --stacktrace --dependency-verification strict
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ github.sha }}
          path: build/reports/verification/current-cross-loader-world.json
          if-no-files-found: error

  cold-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/wrapper-validation@v4
      - run: chmod +x ./gradlew
      - name: Verify from an isolated Gradle home without build cache
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/drinkbeer-gradle-cold
        run: ./gradlew verifyUnit --no-build-cache --stacktrace --dependency-verification strict
