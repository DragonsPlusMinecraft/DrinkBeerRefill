name: Release

on:
  workflow_dispatch:
    inputs:
      verified_commit:
        description: Exact commit that passed CI and local verifyRelease
        required: true
        type: string
      local_client_evidence_commit:
        description: Commit recorded in the local visible-client evidence
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.verified_commit }}
      - name: Require evidence for this exact commit
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ inputs.verified_commit }}"
          test "$actual" = "${{ inputs.local_client_evidence_commit }}"
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Install virtual display and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils
      - name: Re-run complete CI unattended gate
        run: xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew verifyCiRelease --stacktrace --dependency-verification strict
      - name: Publish both loader artifacts
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: ./gradlew publishAllMods --stacktrace --dependency-verification strict
      - name: Upload release evidence and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/run/**/logs/
            **/build/run/**/crash-reports/
            **/build/run/**/hs_err_pid*.log
            **/build/run/**/client-test-evidence/
            **/build/run/**/screenshots/
            build/release/
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            !**/*-sources.jar
            !**/*-dev.jar
          if-no-files-found: warn
