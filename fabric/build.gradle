plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom-remap'
    id 'me.modmuss50.mod-publish-plugin'
}

version = "${mod_version}+fabric"

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modCompileOnly "mezz.jei:jei-${jei_minecraft_version}-fabric-api:${jei_version}"
    modLocalRuntime "mezz.jei:jei-${jei_minecraft_version}-fabric:${jei_version}"

    // Fabric Loader JUnit 0.19.3 is built against JUnit Platform 1.10;
    // keep the launcher lifecycle aligned so Knot remains the test TCCL.
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "net.fabricmc:fabric-loader-junit:${fabric_loader_version}"
}

loom {
    runs {
        client {
            client()
            name = 'Fabric Client'
            runDir = 'runs/client'
        }
        server {
            server()
            name = 'Fabric Server'
            runDir = 'runs/server'
            programArg '--nogui'
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "${mod_id}-gametest"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

sourceSets.named('gametest') {
    java.srcDir project(':common').file('src/gametest/java')
}

tasks.named('test', Test).configure {
    systemProperty 'fabric.side', 'server'
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

publishMods {
    file = tasks.remapJar.archiveFile
    changelog = rootProject.file('CHANGELOG.md').text
    version = project.version
    type = BETA
    displayName = "Drink Beer Refill ${mod_version} for ${minecraft_version} (Fabric)"
    modLoaders.add('fabric')
    curseforge {
        projectId = curseforge_project_id
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add(minecraft_version)
        client = true
        server = true
        requires('fabric-api')
    }
    modrinth {
        projectId = modrinth_project_id
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        minecraftVersions.add(minecraft_version)
        requires('fabric-api')
    }
}
