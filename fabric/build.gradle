plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'me.modmuss50.mod-publish-plugin'
}

version = "${mod_version}+fabric"

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-fabric-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-fabric:${jei_version}"
    runtimeOnly "mezz.jei:jei-${jei_minecraft_version}-fabric:${jei_version}"

    // Fabric Loader JUnit 0.19.3 is built against JUnit Platform 1.10;
    // keep the launcher lifecycle aligned so Knot remains the test TCCL.
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "net.fabricmc:fabric-loader-junit:${fabric_loader_version}"
}

loom {
    runs {
        client {
            client()
            name = 'Fabric Client'
            runDir = 'build/runs/client'
        }
        server {
            server()
            name = 'Fabric Server'
            runDir = 'build/runs/server'
            programArg '--nogui'
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "${mod_id}-gametest"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

def expectedClientBackend = providers.gradleProperty('clientBackend').orElse('OpenGL').get()
if (!['OpenGL', 'Vulkan'].any { it.equalsIgnoreCase(expectedClientBackend) }) {
    throw new GradleException("clientBackend must be OpenGL or Vulkan, got '${expectedClientBackend}'")
}
def normalizedClientBackend = expectedClientBackend.equalsIgnoreCase('Vulkan') ? 'Vulkan' : 'OpenGL'
def clientBackendOption = normalizedClientBackend.toLowerCase(Locale.ROOT)
def clientBackendSlug = clientBackendOption
def fabricClientRunDir = layout.buildDirectory.dir("run/clientGameTest-${clientBackendSlug}")

loom.runs.named('clientGameTest') {
    runDir = "build/run/clientGameTest-${clientBackendSlug}"
}

def cleanClientGameTestRunDir = tasks.register('cleanClientGameTestRunDir', Delete) {
    delete fabricClientRunDir
}

def prepareClientGameTestOptions = tasks.register('prepareClientGameTestOptions', Copy) {
    dependsOn cleanClientGameTestRunDir
    from layout.projectDirectory.file('src/gametest/options.txt')
    into fabricClientRunDir
    inputs.property('graphicsBackend', clientBackendOption)
    filesMatching('options.txt') {
        expand(graphics_backend: clientBackendOption)
    }
}

prepareClientGameTestOptions.configure {
    mustRunAfter tasks.named('deleteGameTestRunDir')
}

tasks.named('runClientGameTest') {
    dependsOn prepareClientGameTestOptions
    args '--graphicsBackend', normalizedClientBackend.toUpperCase(Locale.ROOT)
    systemProperty 'drinkbeer.expectedBackend', normalizedClientBackend
}

def windowsClientWatchdog = rootProject.layout.projectDirectory.file('tools/client-test/windows-client-watchdog.ps1').asFile.absolutePath
def fabricClientEvidence = fabricClientRunDir.get().dir('client-test-evidence').asFile.absolutePath
def isWindowsHost = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')

def startFabricClientWatchdog = tasks.register('startFabricClientWatchdog', Exec) {
    group = 'verification'
    description = 'Starts the PID-scoped visible-window watchdog for the Fabric client test.'
    dependsOn tasks.named('prepareClientGameTestOptions')
    onlyIf { isWindowsHost }
    commandLine 'powershell.exe', '-NoLogo', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', windowsClientWatchdog,
            '-Action', 'Start',
            '-EvidenceDirectory', fabricClientEvidence,
            '-Loader', 'fabric',
            '-ExpectedBackend', normalizedClientBackend
}

def awaitFabricClientWatchdog = tasks.register('awaitFabricClientWatchdog', Exec) {
    group = 'verification'
    description = 'Requires the Fabric client to enter a world in a visible PID-owned window and exit cleanly.'
    onlyIf { isWindowsHost }
    commandLine 'powershell.exe', '-NoLogo', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', windowsClientWatchdog,
            '-Action', 'Await',
            '-EvidenceDirectory', fabricClientEvidence,
            '-Loader', 'fabric',
            '-ExpectedBackend', normalizedClientBackend
}

tasks.named('runClientGameTest') {
    dependsOn startFabricClientWatchdog
    finalizedBy awaitFabricClientWatchdog
}

awaitFabricClientWatchdog.configure {
    mustRunAfter tasks.named('runClientGameTest')
}

sourceSets.named('gametest') {
    java.srcDir project(':common').file('src/gametest/java')
}

def gameTestMinecraftVersion = minecraft_version
tasks.named('processGametestResources', ProcessResources).configure {
    inputs.property('minecraft_version', gameTestMinecraftVersion)
    filesMatching('fabric.mod.json') {
        expand(minecraft_version: gameTestMinecraftVersion)
    }
}

tasks.named('test', Test).configure {
    systemProperty 'fabric.side', 'server'
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

publishMods {
    file = tasks.jar.archiveFile
    changelog = rootProject.file('CHANGELOG.md').text
    version = project.version
    type = BETA
    displayName = "Drink Beer Refill ${mod_version} for ${minecraft_version} (Fabric)"
    modLoaders.add('fabric')
    curseforge {
        projectId = curseforge_project_id
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add(minecraft_version)
        client = true
        server = true
        requires('fabric-api')
    }
    modrinth {
        projectId = modrinth_project_id
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        minecraftVersions.add(minecraft_version)
        requires('fabric-api')
    }
}
